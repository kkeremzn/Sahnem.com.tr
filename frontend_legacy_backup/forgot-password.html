<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifremi Unuttum — Sahnem</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192x192.png">
  <link rel="apple-touch-icon" href="assets/brand/favicon-192x192.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-page" style="grid-template-columns: 1fr;">
  <div class="auth-right" style="width:100%;">
    <div class="auth-form-box">
      <div class="text-center mb-32">
        <a href="index.html" class="auth-logo" style="display:inline-block;margin-bottom:24px;">SAHNEM.</a>
        <h1 class="auth-form-header h1-reset" style="font-family:var(--font-display);font-size:1.8rem;font-weight:800;margin-bottom:8px;">Şifremi Unuttum</h1>
        <p class="body-sm">E-posta adresinize şifre sıfırlama bağlantısı göndereceğiz.</p>
      </div>

      <form class="card" id="forgot-form" style="padding:28px;">
        <div class="form-group mb-20">
          <label class="form-label" for="email">E-posta Adresi</label>
          <input type="email" id="email" class="form-input" placeholder="ornek@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Sıfırlama Bağlantısı Gönder</button>
        <p class="text-center mt-20 body-sm">
          <a href="login.html" class="forgot-link">Giriş sayfasına dön</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script src="js/components.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    showToast('Sıfırlama bağlantısı ' + email + ' adresine gönderildi', 'success');
  });
</script>
</body>
</html>
