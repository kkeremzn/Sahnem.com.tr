<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesajlar — Sahnem</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192x192.png">
  <link rel="apple-touch-icon" href="assets/brand/favicon-192x192.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="no-footer">

<div id="navbar-slot"></div>

<div class="page">
  <div class="messages-layout">
    <aside class="conv-list" id="conv-list">
      <div class="conv-item active" data-id="0">
        <div class="avatar avatar-md avatar-gold">H</div>
        <div style="flex:1;min-width:0;">
          <div class="flex items-center justify-between">
            <span class="display-sm" style="font-size:0.95rem;">Hilton İstanbul</span>
            <span class="body-sm">14:32</span>
          </div>
          <p class="body-sm mt-4" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Düğün organizasyonu için teklifimiz...</p>
        </div>
      </div>
      <div class="conv-item" data-id="1">
        <div class="avatar avatar-md">R</div>
        <div style="flex:1;min-width:0;">
          <div class="flex items-center justify-between">
            <span class="display-sm" style="font-size:0.95rem;">Rixos Hotels</span>
            <span class="body-sm">Dün</span>
          </div>
          <p class="body-sm mt-4" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Cumartesi akşamı müsait misiniz?</p>
        </div>
      </div>
      <div class="conv-item" data-id="2">
        <div class="avatar avatar-md">S</div>
        <div style="flex:1;min-width:0;">
          <div class="flex items-center justify-between">
            <span class="display-sm" style="font-size:0.95rem;">Swissôtel</span>
            <span class="body-sm">Pzt</span>
          </div>
          <p class="body-sm mt-4" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Teklifinizi kabul ettik!</p>
        </div>
      </div>
    </aside>

    <section class="chat-area">
      <div class="chat-header">
        <div class="flex items-center gap-12">
          <div class="avatar avatar-md avatar-gold" id="chat-avatar">H</div>
          <div>
            <div class="display-sm" id="chat-name">Hilton İstanbul</div>
            <p class="body-sm">Organizasyon · İstanbul</p>
          </div>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-bar">
        <input type="text" class="form-input" id="chat-input" placeholder="Mesajınızı yazın...">
        <button type="button" class="btn btn-primary" id="send-btn">Gönder</button>
      </div>
    </section>
  </div>
</div>

<script src="js/components.js"></script>
<script>
  mountLayout({ active: 'messages', loggedIn: true, userType: 'musician', showFooter: false });

  const conversations = [
    {
      name: 'Hilton İstanbul',
      avatar: 'H',
      gold: true,
      messages: [
        { from: 'them', text: 'Merhaba Emre Bey, 15 Haziran düğün organizasyonumuz için teklifimizi gönderdik.' },
        { from: 'them', text: 'Akustik set ile 3 saatlik performans düşünüyoruz. Müsait misiniz?' },
        { from: 'me', text: 'Merhaba, teklifinizi inceledim. Detayları konuşmak isterim.' }
      ]
    },
    {
      name: 'Rixos Hotels',
      avatar: 'R',
      gold: false,
      messages: [
        { from: 'them', text: 'Cumartesi akşamı lobi canlı müziği için müzisyen arıyoruz.' },
        { from: 'me', text: 'Cumartesi akşamı müsaitim, set listesini paylaşabilirim.' }
      ]
    },
    {
      name: 'Swissôtel',
      avatar: 'S',
      gold: false,
      messages: [
        { from: 'them', text: 'Kurumsal etkinlik için fiyat teklifinizi aldık.' },
        { from: 'them', text: 'Teklifinizi kabul ettik! Sözleşme detaylarını paylaşacağız.' },
        { from: 'me', text: 'Harika haber, teşekkür ederim!' }
      ]
    }
  ];

  let activeConv = 0;
  const chatMessages = document.getElementById('chat-messages');
  const chatName = document.getElementById('chat-name');
  const chatAvatar = document.getElementById('chat-avatar');
  const chatInput = document.getElementById('chat-input');

  function renderMessages() {
    const conv = conversations[activeConv];
    chatName.textContent = conv.name;
    chatAvatar.textContent = conv.avatar;
    chatAvatar.className = 'avatar avatar-md' + (conv.gold ? ' avatar-gold' : '');
    chatMessages.innerHTML = conv.messages.map(m =>
      `<div class="chat-bubble ${m.from}">${m.text}</div>`
    ).join('');
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  document.querySelectorAll('.conv-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.conv-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      activeConv = parseInt(item.dataset.id, 10);
      renderMessages();
    });
  });

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    conversations[activeConv].messages.push({ from: 'me', text });
    chatInput.value = '';
    renderMessages();
    showToast('Mesaj gönderildi', 'success');
  }

  document.getElementById('send-btn').addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  renderMessages();
</script>
</body>
</html>
